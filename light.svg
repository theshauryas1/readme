<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1180" height="610" viewBox="0 0 1180 610">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Orbitron:wght@700&amp;display=swap');
      text { font-family: 'Share Tech Mono', 'Courier New', monospace; }
      .title { font-family: 'Orbitron', 'Share Tech Mono', monospace; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .live-dot { animation: livePulse 1.2s ease-in-out infinite alternate; }
      @keyframes livePulse { from { opacity: 1; } to { opacity: 0.15; } }
      .panel-glow { animation: panelGlow 3s ease-in-out infinite alternate; }
      @keyframes panelGlow {
        from { filter: drop-shadow(0 0 4px #0891b255); }
        to   { filter: drop-shadow(0 0 14px #0891b2aa); }
      }
      #lf0 { animation: lf0a 9s steps(1) infinite; }
      #lf1 { animation: lf1a 9s steps(1) infinite; }
      #lf2 { animation: lf2a 9s steps(1) infinite; }
      #lf3 { animation: lf3a 9s steps(1) infinite; }
      #lf4 { animation: lf4a 9s steps(1) infinite; }
      #lf5 { animation: lf5a 9s steps(1) infinite; }
      @keyframes lf0a { 0%,100%{opacity:1} 16.7%,83.4%{opacity:0} }
      @keyframes lf1a { 0%,16.6%,100%{opacity:0} 16.7%,33.3%{opacity:1} 33.4%{opacity:0} }
      @keyframes lf2a { 0%,33.3%,100%{opacity:0} 33.4%,50%{opacity:1} 50.1%{opacity:0} }
      @keyframes lf3a { 0%,50%,100%{opacity:0} 50.1%,66.6%{opacity:1} 66.7%{opacity:0} }
      @keyframes lf4a { 0%,66.6%,100%{opacity:0} 66.7%,83.3%{opacity:1} 83.4%{opacity:0} }
      @keyframes lf5a { 0%,83.3%{opacity:0} 83.4%,100%{opacity:1} }
    </style>

    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F0F7FF"/>
      <stop offset="100%" stop-color="#E2EEF8"/>
    </linearGradient>
    <linearGradient id="cyanGL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="purpleGL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <pattern id="gridPatL" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0891B2" stroke-width="0.3" opacity="0.2"/>
    </pattern>

    <clipPath id="portraitClipL">
