# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/snake.yml
#
# Generates GitHub contribution snake SVGs (light + dark, palette-themed)
# and pushes them to the `output` branch via GitHub Pages action.
#
# BEFORE THIS WORKS — set repo permissions:
#   GitHub.com → theshauryas1/theshauryas1 → Settings
#   → Actions → General → Workflow permissions
#   → ✅  Read and write permissions   ← this is the REPO settings, not account
#   → Save
#
# Only add the <picture> block to README after this Action runs green at least once.
# The `output` branch does not exist before then.
# ─────────────────────────────────────────────────────────────────────────────

name: Generate Contribution Snake

on:
  # Run every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

  # Also regenerate whenever README or workflow itself changes
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"

# Required to push the output branch
permissions:
  contents: write

jobs:
  generate-snake:
    name: Generate Snake SVGs
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out repo ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Generate both snake SVGs ───────────────────────────────────────
      - name: Generate snake (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: theshauryas1

          # outputs is a single multi-line block scalar — both files in one key.
          # color_dots format: empty_cell, level1, level2, level3, level4
          #
          # Light snake: soft blue-grey empty cell (visible on GitHub #ffffff bg)
          # Dark snake:  slate #2d3343 empty cell (visible on GitHub #0d1117 bg)
          #              near-black would disappear and the grid would look broken.
          outputs: |
            dist/github-snake.svg?color_snake=#10B981&color_dots=#E2E8F0,#BAE6FD,#38BDF8,#0891B2,#0E7490
            dist/github-snake-dark.svg?color_snake=#A78BFA&color_dots=#2d3343,#1E3A5F,#1D6A8B,#10B981,#7C3AED

      # ── 3. Push to output branch ──────────────────────────────────────────
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
